name: Fetch listing photos
# The daily ad task can't download images from api.swiftstay.uk (its sandbox blocks it),
# so it writes "<listing id> <image url>" lines to listings/REQUEST and pushes.
# This workflow downloads each photo into listings/<id>/<file>.jpg and commits it.
on:
  workflow_dispatch:
  push:
    paths:
      - "listings/REQUEST"
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download requested photos
        run: |
          exec > >(tee listings/fetch.log) 2>&1
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36"
          grep -v '^#' listings/REQUEST | while read id url; do
            [ -z "$url" ] && continue
            mkdir -p listings/$id
            f=listings/$id/$(basename "${url%%\?*}")
            [ -s "$f" ] && { echo "have $f"; continue; }
            ok=no
            for u in "$url" "${url/api.swiftstay.uk/swiftstay-api.jokeko1515.workers.dev}"; do
              curl -sSL -A "$UA" "$u" -o "$f.tmp" && file -b --mime-type "$f.tmp" | grep -q '^image/' && { mv "$f.tmp" "$f"; ok=yes; echo "ok $f <- $u"; break; }
              echo "fail $u ($(file -b --mime-type "$f.tmp" 2>/dev/null))"
            done
            rm -f "$f.tmp"
          done
      - name: Commit
        run: |
          git config user.name "swiftstay-bot"
          git config user.email "swiftstay-bot@users.noreply.github.com"
          git add listings
          git diff --cached --quiet || (git commit -m "Fetch listing photos" && git push)
